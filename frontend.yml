AWSTemplateFormatVersion: '2010-09-09'
Description: 'Combined Frontend Components and ECS Deployment with Blue/Green Strategy'

Parameters:
  EnvironmentName:
    Description: Environment name that will be prefixed to resource names
    Type: String
    Default: 'weekfiveproject'

  FrontendContainerImage:
    Description: Frontend container image to use (should be a valid public image)
    Type: String
    Default: 'public.ecr.aws/m9u6i6o1/week6-public-repo:image-uploader-frontend'

  BackendALBDNSName:
    Description: DNS name of the Backend Application Load Balancer
    Type: String
    Default: 'week6front-alb'

  DeployService:
    Description: Whether to deploy the ECS service (set to false for initial infrastructure)
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
      
  TaskCount:
    Description: Number of tasks to run in the service
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10

  ServiceName:
    Description: Name of the ECS service
    Type: String
    Default: 'frontend-service'

Conditions:
  ShouldDeployService: !Equals [!Ref DeployService, 'true']

Resources:
  # Original Frontend Resources
  FrontendLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-frontend-ALB'
      Subnets:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet1'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet2'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-ALBSecurityGroupId'
      Scheme: internet-facing
      Type: application
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-frontend-ALB'

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-frontend-TG'
      Port: 80
      Protocol: HTTP
      VpcId: 
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckPort: '80'
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-frontend-TG'

  FrontendALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn:
      - FrontendLoadBalancer
      - FrontendTargetGroup
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup
      LoadBalancerArn: !Ref FrontendLoadBalancer
      Port: 80
      Protocol: HTTP

  FrontendCloudWatchLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}-frontend'
      RetentionInDays: 30

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-frontend-task'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: 
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskRoleArn'
      TaskRoleArn: 
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskRoleArn'
      ContainerDefinitions:
        - Name: !Sub '${EnvironmentName}-frontend-container'
          Image: !Ref FrontendContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 80
              HostPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendCloudWatchLogsGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: S3_BUCKET_NAME
              Value: 
                Fn::ImportValue: !Sub '${EnvironmentName}-S3BucketName'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: BACKEND_API_URL
              Value: !Sub 'http://${BackendALBDNSName}'
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:80/ || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-frontend-TaskDefinition'

  # ECS Cluster Resources
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-cluster'

  # Green Target Group for Blue/Green Deployment
  FrontendGreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-fg-TG'
      Port: 80
      Protocol: HTTP
      VpcId: 
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckPort: '80'
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-frontend-green-TG'

  # CodeDeploy Resources
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-codedeploy-service-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS'

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${EnvironmentName}-frontend-app'
      ComputePlatform: ECS

  # ECS Service with CodeDeploy integration - with correct dependencies
  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - FrontendALBListener  # Explicit dependency on the listener
      - CodeDeployServiceRole
    Condition: ShouldDeployService
    Properties:
      Cluster: !Ref ECSCluster
      ServiceName: !Sub '${EnvironmentName}-${ServiceName}'
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: !Ref TaskCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - Fn::ImportValue: !Sub '${EnvironmentName}-ECSSecurityGroupId'
          Subnets:
            - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1'
            - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet2'
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: !Sub '${EnvironmentName}-frontend-container'
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup
      DeploymentController:
        Type: CODE_DEPLOY
      HealthCheckGracePeriodSeconds: 120
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-${ServiceName}'

  # CodeDeploy Deployment Group
  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Condition: ShouldDeployService
    DependsOn: 
      - ECSService
      - FrontendALBListener
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${EnvironmentName}-frontend-dg'
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 5
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      ECSServices:
        - ClusterName: !Ref ECSCluster
          ServiceName: !If [ShouldDeployService, !GetAtt ECSService.Name, !Ref 'AWS::NoValue']
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref FrontendALBListener
            TargetGroups:
              - Name: !GetAtt FrontendTargetGroup.TargetGroupName
              - Name: !GetAtt FrontendGreenTargetGroup.TargetGroupName

Outputs:
  FrontendAlbDnsName:
    Description: DNS name of the Frontend Application Load Balancer
    Value: !GetAtt FrontendLoadBalancer.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-FrontendAlbDnsName'

  FrontendTargetGroupArn:
    Description: ARN of the Frontend ALB Target Group
    Value: !Ref FrontendTargetGroup
    Export:
      Name: !Sub '${EnvironmentName}-FrontendTargetGroupArn'

  FrontendTargetGroupName:
    Description: Name of the Frontend ALB Target Group
    Value: !GetAtt FrontendTargetGroup.TargetGroupName
    Export:
      Name: !Sub '${EnvironmentName}-FrontendTargetGroupName'

  FrontendDeploymentEnabled:
    Description: Whether the Frontend ECS service is deployed
    Value: !Ref DeployService
    Export:
      Name: !Sub '${EnvironmentName}-FrontendDeploymentEnabled'

  FrontendALBListenerArn:
    Description: ARN of the Frontend ALB Listener
    Value: !Ref FrontendALBListener
    Export:
      Name: !Sub '${EnvironmentName}-FrontendALBListenerArn'

  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${EnvironmentName}-ClusterName'
  
  ServiceName:
    Description: ECS Service Name
    Value: !If [ShouldDeployService, !GetAtt ECSService.Name, 'No Service Deployed']
    Export:
      Name: !Sub '${EnvironmentName}-ServiceName'
  
  CodeDeployApplicationName:
    Description: CodeDeploy Application Name
    Value: !Ref CodeDeployApplication
    Export:
      Name: !Sub '${EnvironmentName}-CodeDeployApplicationName'
  
  CodeDeployDeploymentGroupName:
    Description: CodeDeploy Deployment Group Name
    Value: !If [ShouldDeployService, !Ref CodeDeployDeploymentGroup, 'No Deployment Group Created']
    Export:
      Name: !Sub '${EnvironmentName}-CodeDeployDeploymentGroupName'

  GreenTargetGroupArn:
    Description: ARN of the Green Target Group
    Value: !Ref FrontendGreenTargetGroup
    Export:
      Name: !Sub '${EnvironmentName}-GreenTargetGroupArn'