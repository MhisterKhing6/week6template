AWSTemplateFormatVersion: '2010-09-09'
Description: 'Frontend Components for Containerized Web Application'

Parameters:
  EnvironmentName:
    Description: Environment name that will be prefixed to resource names
    Type: String
    Default: 'weekfiveproject'
  
  # Frontend container image parameter
  FrontendContainerImage:
    Description: Frontend container image to use (should be a valid public image)
    Type: String
    Default: 'public.ecr.aws/m9u6i6o1/week6-public-repo:image-uploader-frontend'

  # Backend ALB DNS Name Reference
  BackendALBDNSName:
    Description: DNS name of the Backend Application Load Balancer
    Type: String
    Default:'week6front-alb'

  # Add deployment toggle parameter
  DeployService:
    Description: Whether to deploy the ECS service (set to false for initial infrastructure)
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  # Define conditions for optional resources
  ShouldDeployService: !Equals [!Ref DeployService, 'true']

Resources:
  # Frontend Application Load Balancer - in public subnets
  FrontendLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-frontend-ALB'
      Subnets:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet1'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet2'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-ALBSecurityGroupId'
      Scheme: internet-facing
      Type: application
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-frontend-ALB'

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-frontend-TG'
      Port: 80
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckPort: '80'
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-frontend-TG'

  FrontendALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup
      LoadBalancerArn: !Ref FrontendLoadBalancer
      Port: 80
      Protocol: HTTP

  # CloudWatch Logs
  FrontendCloudWatchLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}-frontend'
      RetentionInDays: 30

  # Task Definition for Frontend
  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-frontend-task'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: 
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskRoleArn'
      TaskRoleArn: 
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSTaskRoleArn'
      ContainerDefinitions:
        - Name: !Sub '${EnvironmentName}-frontend-container'
          Image: !Ref FrontendContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 80
              HostPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendCloudWatchLogsGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: S3_BUCKET_NAME
              Value: !ImportValue 
                Fn::Sub: '${EnvironmentName}-S3BucketName'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: BACKEND_API_URL
              Value: !Sub 'http://${BackendALBDNSName}'
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:80/ || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-frontend-TaskDefinition'

  # Green Target Group for Blue/Green Deployment
  FrontendGreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-frontend-green-tg'
      Port: 80
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VpcId'
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckPort: '80'
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-frontend-GreenTG'

  # Test listener for Blue/Green deployment testing
  FrontendTestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendGreenTargetGroup
      LoadBalancerArn: !Ref FrontendLoadBalancer
      Port: 8080
      Protocol: HTTP

  # CodeDeploy Application for Frontend
  FrontendCodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${EnvironmentName}-frontend-deploy-app'
      ComputePlatform: ECS

  # Conditionally deploy the frontend ECS service
  FrontendService:
    Type: AWS::ECS::Service
    Condition: ShouldDeployService
    DependsOn: FrontendALBListener
    Properties:
      ServiceName: !Sub '${EnvironmentName}-frontend-service'
      Cluster: 
        Fn::ImportValue: !Sub '${EnvironmentName}-ECSCluster'
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: 2
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub '${EnvironmentName}-ECSSecurityGroupId'
          Subnets:
            - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet1'
            - Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnet2'
      LoadBalancers:
        - ContainerName: !Sub '${EnvironmentName}-frontend-container'
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-frontend-Service'

  # Conditionally deploy the CodeDeploy deployment group
  FrontendCodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Condition: ShouldDeployService
    Properties:
      ApplicationName: !Ref FrontendCodeDeployApplication
      DeploymentGroupName: !Sub '${EnvironmentName}-frontend-deploy-group'
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      ServiceRoleArn: 
        Fn::ImportValue: !Sub '${EnvironmentName}-CodeDeployRoleArn'
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      ECSServices:
        - ClusterName: 
            Fn::ImportValue: !Sub '${EnvironmentName}-ECSCluster'
          ServiceName: !GetAtt FrontendService.Name
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref FrontendALBListener
            TestTrafficRoute:
              ListenerArns:
                - !Ref FrontendTestListener
            TargetGroups:
              - Name: !GetAtt FrontendTargetGroup.TargetGroupName
              - Name: !GetAtt FrontendGreenTargetGroup.TargetGroupName

  # Auto Scaling (only when service is deployed)
  FrontendAutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: ShouldDeployService
    Properties:
      MaxCapacity: 10
      MinCapacity: 2
      ResourceId: !Sub 'service/${ImportValue:${EnvironmentName}-ECSCluster}/${FrontendService.Name}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  FrontendAutoScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ShouldDeployService
    Properties:
      PolicyName: !Sub '${EnvironmentName}-frontend-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref FrontendAutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

Outputs:
  FrontendAlbDnsName:
    Description: DNS name of the Frontend Application Load Balancer
    Value: !GetAtt FrontendLoadBalancer.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-FrontendAlbDnsName'

  FrontendTargetGroupArn:
    Description: ARN of the Frontend ALB Target Group
    Value: !Ref FrontendTargetGroup
    Export:
      Name: !Sub '${EnvironmentName}-FrontendTargetGroupArn'

  FrontendDeploymentEnabled:
    Description: Whether the Frontend ECS service is deployed
    Value: !Ref DeployService
    Export:
      Name: !Sub '${EnvironmentName}-FrontendDeploymentEnabled'